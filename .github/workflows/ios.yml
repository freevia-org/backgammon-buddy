name: iOS
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Explicit build number above previous releases (or set RELEASE_BUILD_NUMBER_BASE)
        type: string
        default: ''
      export_method:
        description: Signed export type (App Store option creates an artifact only)
        type: choice
        options: [ad-hoc, app-store-connect]
        default: ad-hoc
  # On-demand release lane. Dispatch ci.yml first for this commit; this lane
  # waits for its successful result before distributing to testers.

permissions:
  contents: read
  # `gh run list` in the Wait-for-CI gate reads CI's run for this commit.
  actions: read

concurrency:
  # PRs: superseded pushes are cancelled. master/dispatch: commit-keyed, see
  # android.yml.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  ios:
    name: build .app + (gated) signed distribute
    # Pinned image + pinned Xcode (below) rather than macos-latest: the
    # `-latest` label moves to a new macOS/Xcode under the build without any
    # change in the repo. Bump both deliberately, together.
    runs-on: macos-26
    # macOS runners are the slowest in the fleet: Flutter builds the release
    # app, Xcode archives it, and configured signing exports it. The job can
    # also wait up to ~40 min for CI before Firebase distribution (normally
    # zero). Generous by design.
    timeout-minutes: 75
    env:
      # Supported by the locked FlutterFire SPM package; this app has no ads.
      # Select FirebaseAnalyticsCore instead of the identity/ad conversion product.
      FIREBASE_ANALYTICS_WITHOUT_ADID: 'true'
      XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Explicit Xcode, so an image update that changes the default Xcode cannot
      # silently change the SDK/toolchain the app is built and signed with.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -eu
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE is not installed. Installed: $(printf '%s ' /Applications/Xcode*.app)"
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-version || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Resolve build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ vars.RELEASE_BUILD_NUMBER_BASE }}
        run: python3 tool/release_build_number.py

      - name: Rust toolchain (iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine_shim
          shared-key: ios-deployment-target-15

      # iOS forbids dlopen of an arbitrary dylib, so the engine is linked
      # STATICALLY into Runner. Build the device-ABI staticlib; the -force_load
      # in app/ios/Flutter/Release.xcconfig pulls all shim symbols into the
      # binary (they are referenced only via dart:ffi at runtime). See
      # native/README.md "iOS (static linking into the Runner)".
      - name: Build engine shim staticlib (aarch64-apple-ios)
        working-directory: native/engine_shim
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: cargo build --release --target aarch64-apple-ios

      # Stage the .a where Release.xcconfig's -force_load expects it
      # ($(PROJECT_DIR)/Frameworks -> app/ios/Frameworks). The dir is kept in
      # the tree by .gitkeep; the .a is git-ignored (app/ios/Frameworks/.gitignore).
      - name: Build GNUbg headless static library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: bash native/gnubg/build-ios.sh

      - name: Stage staticlib into app/ios/Frameworks
        run: |
          mkdir -p app/ios/Frameworks
          cp native/engine_shim/target/aarch64-apple-ios/release/libaigammon_engine.a \
             app/ios/Frameworks/libaigammon_engine.a
          ls -l app/ios/Frameworks/libaigammon_engine.a

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Verify iOS transport provider selection
        working-directory: app
        run: >-
          flutter test test/online/ios_transport_provider_test.dart
          --dart-define=BGB_IOS_URLSESSION_TRANSPORT=true

      # Swift Package Manager: Xcode spent ~2 min per run cloning
      # firebase-ios-sdk, grpc/abseil binaries etc. Cache SwiftPM's shared
      # repository cache and the resolved checkouts in DerivedData. EXACT key
      # on Package.resolved (no prefix restore): the dependency-inventory step
      # below scans DerivedData, so it must never see checkouts left over from a
      # previous resolution.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Runner-*/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('app/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'app/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build Flutter iOS engine with Apple OS TLS only
        run: bash tool/build_flutter_ios_engine.sh

      # Unsigned build — always runs, and is the gate for a GREEN job. Same
      # online-play dart-define pattern as android.yml: repo VARIABLES
      # AIGAMMON_FIREBASE_PROJECT / AIGAMMON_FIREBASE_API_KEY enable production
      # online play; unset -> "not configured". Build number = run number so
      # testers can tell builds apart.
      #
      # --obfuscate --split-debug-info: see the same flags in android.yml for
      # what it costs and why the symbols are uploaded separately. The signed
      # build below keeps its own exact Dart symbols alongside archive dSYMs.
      - name: Build unsigned .app
        working-directory: app
        env:
          FB_PROJECT: ${{ vars.AIGAMMON_FIREBASE_PROJECT }}
          FB_API_KEY: ${{ vars.AIGAMMON_FIREBASE_API_KEY }}
          FB_SENDER_ID: ${{ vars.AIGAMMON_FIREBASE_SENDER_ID }}
          # Reused from the App Distribution setup — one iOS app id serves both
          # distribution and telemetry, so there is no second secret for it.
          FB_IOS_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_IOS_APP_ID || '' }}
        run: |
          DEFINES=""
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ]; then
            DEFINES="--dart-define=AIGAMMON_FIREBASE_PROJECT=$FB_PROJECT --dart-define=AIGAMMON_FIREBASE_API_KEY=$FB_API_KEY"
            echo "Online play ENABLED for project $FB_PROJECT"
          else
            echo "Online-play repo variables not set — building with online play not configured"
          fi
          # Analytics / Performance / Crashlytics — see android.yml for the
          # same block and firebase/DEPLOY.md for the values.
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ] \
             && [ -n "$FB_SENDER_ID" ] && [ -n "$FB_IOS_APP_ID" ]; then
            DEFINES="$DEFINES --dart-define=AIGAMMON_FIREBASE_SENDER_ID=$FB_SENDER_ID --dart-define=AIGAMMON_FIREBASE_IOS_APP_ID=$FB_IOS_APP_ID"
            echo "Telemetry configured (collection requires user opt-in)"
          else
            echo "Telemetry config incomplete — building with analytics/performance/crashlytics disabled"
          fi
          # DEFINES is a flag list and must word-split.
          # shellcheck disable=SC2086
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --local-engine-src-path="$FLUTTER_ENGINE_SRC_PATH" \
            --local-engine=ios_release \
            --local-engine-host=host_release_arm64 \
            --obfuscate --split-debug-info=build/symbols/ios \
            --dart-define=BGB_IOS_URLSESSION_TRANSPORT=true \
            $DEFINES

      # The main executable is the dynamic library used by dart:ffi on iOS.
      # Check the actual dynamic export trie so CI catches linker/strip changes
      # before a broken .app can be distributed.
      - name: Verify CommonCrypto cache hash compatibility
        run: bash tool/verify_ios_cache_hash_equivalence.sh

      - name: Verify unsigned iOS FFI exports
        run: python3 tool/verify_ios_ffi_exports.py --binary app/build/ios/iphoneos/Runner.app/Runner

      - name: Verify iOS URLSession transport profile
        run: python3 tool/verify_ios_transport.py app/build/ios/iphoneos/Runner.app

      # Exercise the actual Xcode archive on PRs too. This is unsigned so the
      # secret-free build can verify archive stripping without a profile; the
      # signed path below exports this same archive when credentials exist.
      - name: Archive app without signing and verify archived FFI exports
        working-directory: app
        run: |
          xcodebuild \
            -derivedDataPath "$RUNNER_TEMP/RunnerArchiveDerivedData" \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            LD_GENERATE_MAP_FILE=YES
          ARCHIVED_APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          python3 ../tool/verify_ios_ffi_exports.py --binary "$ARCHIVED_APP/Runner"
          LINK_MAPS=()
          while IFS= read -r LINK_MAP; do LINK_MAPS+=("$LINK_MAP"); done < <(find "$RUNNER_TEMP/RunnerArchiveDerivedData" -type f -name '*LinkMap*.txt' -print | sort)
          SYMBOL_FILES=()
          while IFS= read -r SYMBOL_FILE; do SYMBOL_FILES+=("$SYMBOL_FILE"); done < <(find "$RUNNER_TEMP/Runner.xcarchive/dSYMs" -type f -path '*/Contents/Resources/DWARF/*' -print | sort)
          RUNNER_DSYM="$RUNNER_TEMP/Runner.xcarchive/dSYMs/Runner.app.dSYM/Contents/Resources/DWARF/Runner"
          test "${#LINK_MAPS[@]}" -gt 0
          test "${#SYMBOL_FILES[@]}" -gt 0
          test -f "$RUNNER_DSYM"
          TRANSPORT_ARGS=()
          for LINK_MAP in "${LINK_MAPS[@]}"; do TRANSPORT_ARGS+=(--link-map "$LINK_MAP"); done
          for SYMBOL_FILE in "${SYMBOL_FILES[@]}"; do TRANSPORT_ARGS+=(--symbol-file "$SYMBOL_FILE"); done
          python3 ../tool/verify_ios_transport.py "$ARCHIVED_APP" \
            --generated-config ios/Flutter/Generated.xcconfig \
            --require-link-maps --require-symbol-files \
            "${TRANSPORT_ARGS[@]}"

      # Runner.app is a directory containing symlinks; upload-artifact would
      # mangle them, so package it with ditto (the macOS archive idiom) first.
      - name: Zip Runner.app
        run: >-
          ditto -c -k --keepParent
          "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          app/build/ios/iphoneos/Runner.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-engine-profile-${{ github.run_number }}
          path: ${{ runner.temp }}/flutter-engine-build-profile.txt
          if-no-files-found: error

      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-symbols-ios-${{ github.run_number }}
          path: app/build/symbols/ios
          if-no-files-found: error

      - name: Capture iOS native dependencies and privacy manifests
        run: |
          python3 tool/mobile_dependency_inventory.py \
            --artifact app/build/ios/iphoneos/Runner.app.zip \
            --apple-source-root app/ios --apple-source-root app/build/ios \
            --apple-source-root "$HOME/Library/Developer/Xcode/DerivedData" \
            --require-no-apple-ad-support \
            --out-dir app/build/mobile-dependencies/ios-unsigned
          xcodebuild -version > app/build/mobile-dependencies/ios-unsigned/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version > app/build/mobile-dependencies/ios-unsigned/sdk-version.txt

      - name: Upload iOS dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-dependencies-${{ github.run_number }}
          path: app/build/mobile-dependencies/ios-unsigned
          if-no-files-found: warn

      - name: Validate iOS native dependencies and privacy manifests
        run: |
          python3 tool/mobile_notices.py --check \
            --apple-inventory app/build/mobile-dependencies/ios-unsigned/inventory.json \
            --flutter-license "$(dirname "$(dirname "$(command -v flutter)")")/bin/cache/pkg/sky_engine/LICENSE"

      # ---------------------------------------------------------------------
      # Signing + Firebase distribution (secret-gated).
      #
      # Signing needs the certificate, password, selected profile and an explicit
      # build-number baseline. Store exports require the separate store profile.
      # Ad-hoc Firebase distribution additionally needs the Firebase secrets:
      #   IOS_CERT_P12_BASE64            base64 of the Apple Distribution .p12
      #   IOS_CERT_PASSWORD             the .p12 export password
      #   IOS_PROVISIONING_PROFILE_BASE64  base64 of the ad-hoc .mobileprovision
      #   FIREBASE_IOS_APP_ID           1:...:ios:... from the Firebase console
      # plus the existing FIREBASE_SERVICE_ACCOUNT secret (reused from Android).
      # See .github/workflows/README.md (iOS) and firebase/DEPLOY.md (iOS
      # distribution) for how to produce them.
      #
      # UNTESTED until the user adds those secrets — the unsigned path above is
      # what keeps this job green in the meantime.
      # ---------------------------------------------------------------------
      - name: Check iOS signing secrets
        id: ios
        env:
          IOS_CERT_P12_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_CERT_P12_BASE64 || '' }}
          IOS_CERT_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.IOS_CERT_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_APP_STORE_PROFILE_BASE64 || '' }}
          EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
          FIREBASE_IOS_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_IOS_APP_ID || '' }}
          # FIREBASE_SERVICE_ACCOUNT is reused from Android; gate on it too so a
          # missing service account skips cleanly instead of failing at distribute.
          FIREBASE_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
        run: |
          PROFILE="$IOS_PROVISIONING_PROFILE_BASE64"
          if [ "$EXPORT_METHOD" = 'app-store-connect' ]; then
            PROFILE="$IOS_APP_STORE_PROFILE_BASE64"
            if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_CERT_PASSWORD" ] || [ -z "$PROFILE" ]; then
              echo '::error::Store export requires the distribution certificate, password and IOS_APP_STORE_PROFILE_BASE64.'
              exit 1
            fi
          fi
          if [ -n "$IOS_CERT_P12_BASE64" ] && [ -n "$IOS_CERT_PASSWORD" ] \
             && [ -n "$PROFILE" ]; then
            if [ "$HAS_RELEASE_BUILD_NUMBER" != 'true' ]; then
              echo '::error::Set RELEASE_BUILD_NUMBER_BASE or a build_number above prior published versions before signing.'
              exit 1
            fi
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EXPORT_METHOD" = 'ad-hoc' ] && [ -n "$FIREBASE_IOS_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "has_distribution=true" >> "$GITHUB_OUTPUT"
          fi

      # Import the distribution cert into a throwaway keychain, install the
      # provisioning profile, derive team id / profile name / UUID from the
      # profile itself (so nothing is hard-coded), write ExportOptions.plist,
      # and export a signed IPA. All in one step so the derived values
      # stay in scope. Expected profile name: `aigammon-adhoc`.
      - name: Export signed IPA
        id: ipa
        if: steps.ios.outputs.has_signing == 'true'
        working-directory: app
        env:
          IOS_CERT_P12_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_CERT_P12_BASE64 || '' }}
          IOS_CERT_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.IOS_CERT_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.IOS_APP_STORE_PROFILE_BASE64 || '' }}
          EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
        run: |
          set -euo pipefail

          # --- Keychain: import the distribution certificate ---
          KEYCHAIN="$RUNNER_TEMP/aigammon-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend our keychain to the search list so codesign finds the identity.
          # The existing search list must split into one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          # --- Install the provisioning profile & read its metadata ---
          PROFILE="$IOS_PROVISIONING_PROFILE_BASE64"
          if [ "$EXPORT_METHOD" = 'app-store-connect' ]; then PROFILE="$IOS_APP_STORE_PROFILE_BASE64"; fi
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PLIST"
          python3 ../tool/ios_export_options.py "$PLIST" "$RUNNER_TEMP/ExportOptions.plist" --method "$EXPORT_METHOD"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES_DIR/$UUID.mobileprovision"

          # Register all three with the runner's log scrubber BEFORE anything
          # can print them. These are derived from a SECRET (the base64
          # .mobileprovision) but GitHub only masks the secret it was given, not
          # values computed out of it — so without this the team id, the profile
          # name and the profile UUID appear in plain text in a public build log
          # the moment xcodebuild echoes its own command line, which it does.
          #
          # None of the three is a credential on its own: signing needs the
          # private key in the .p12. But the team id is the account identifier
          # Apple support and App Store Connect treat as knowing-something, and a
          # profile UUID plus a team id is exactly the pair a social-engineering
          # attempt against an Apple Developer account wants. The Firebase
          # project id and API key in these workflows are deliberately public
          # (they ship inside every binary); these are not in that class.
          echo "::add-mask::$TEAM_ID"
          echo "::add-mask::$PROFILE_NAME"
          echo "::add-mask::$UUID"
          echo "Installed provisioning profile (name, UUID and team id masked)"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa

          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | sort | head -1)"
          python3 ../tool/verify_ios_ffi_exports.py --ipa "$IPA"
          LINK_MAPS=()
          while IFS= read -r LINK_MAP; do LINK_MAPS+=("$LINK_MAP"); done < <(find "$RUNNER_TEMP/RunnerArchiveDerivedData" -type f -name '*LinkMap*.txt' -print | sort)
          SYMBOL_FILES=()
          while IFS= read -r SYMBOL_FILE; do SYMBOL_FILES+=("$SYMBOL_FILE"); done < <(find "$RUNNER_TEMP/Runner.xcarchive/dSYMs" -type f -path '*/Contents/Resources/DWARF/*' -print | sort)
          RUNNER_DSYM="$RUNNER_TEMP/Runner.xcarchive/dSYMs/Runner.app.dSYM/Contents/Resources/DWARF/Runner"
          test "${#LINK_MAPS[@]}" -gt 0
          test "${#SYMBOL_FILES[@]}" -gt 0
          test -f "$RUNNER_DSYM"
          TRANSPORT_ARGS=()
          for LINK_MAP in "${LINK_MAPS[@]}"; do TRANSPORT_ARGS+=(--link-map "$LINK_MAP"); done
          for SYMBOL_FILE in "${SYMBOL_FILES[@]}"; do TRANSPORT_ARGS+=(--symbol-file "$SYMBOL_FILE"); done
          python3 ../tool/verify_ios_transport.py --ipa "$IPA" \
            --generated-config ios/Flutter/Generated.xcconfig \
            --require-link-maps --require-symbol-files \
            "${TRANSPORT_ARGS[@]}"
          echo "Built IPA: $IPA"
          echo "ipa_path=app/$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        if: steps.ios.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-${{ inputs.export_method || 'ad-hoc' }}-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error

      - name: Capture signed IPA dependency evidence
        if: steps.ios.outputs.has_signing == 'true'
        env:
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          python3 tool/mobile_dependency_inventory.py --artifact "$IPA_PATH" \
            --require-no-apple-ad-support --out-dir app/build/mobile-dependencies/ios-signed

      - name: Upload signed IPA dependency evidence
        if: steps.ios.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-signed-dependencies-${{ github.run_number }}
          path: app/build/mobile-dependencies/ios-signed
          if-no-files-found: error

      - name: Upload iOS archive symbols
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-ios-archive-symbols-${{ github.run_number }}
          path: ${{ runner.temp }}/Runner.xcarchive/dSYMs
          if-no-files-found: error

      # Distribution gate: block until CI has passed for this commit (see
      # android.yml). Manual dispatch stays the ungated escape hatch.
      - name: Wait for CI to pass on this commit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && steps.ios.outputs.has_signing == 'true' && steps.ios.outputs.has_distribution == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/wait-for-ci.sh

      - name: Node for macOS Firebase distribution
        if: steps.ios.outputs.has_signing == 'true' && steps.ios.outputs.has_distribution == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Firebase CLI for macOS distribution
        if: steps.ios.outputs.has_signing == 'true' && steps.ios.outputs.has_distribution == 'true'
        # Container actions cannot run on macOS. Keep CLI install separate from
        # credential access, and pin its exact reviewed package version.
        run: npm install --global firebase-tools@15.25.1

      - name: Distribute IPA to Firebase App Distribution
        if: steps.ios.outputs.has_signing == 'true' && steps.ios.outputs.has_distribution == 'true'
        env:
          FIREBASE_IOS_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_IOS_APP_ID || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail
          umask 077
          GOOGLE_APPLICATION_CREDENTIALS="$(mktemp "$RUNNER_TEMP/firebase-distribution.XXXXXX")"
          export GOOGLE_APPLICATION_CREDENTIALS
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT
          firebase appdistribution:distribute "$IPA_PATH" \
            --app "$FIREBASE_IOS_APP_ID" --groups testers --non-interactive

      - name: Skip signing + distribution (secrets not set)
        if: steps.ios.outputs.has_signing != 'true'
        run: |
          echo "iOS signing secrets not set — built an UNSIGNED .app only (artifact aigammon-ios-unsigned)."
          echo "An unsigned .app CANNOT be installed on an iPhone. To produce a signed, installable"
          echo "IPA and push it to Firebase App Distribution, add the four iOS secrets described in"
          echo ".github/workflows/README.md (iOS) and firebase/DEPLOY.md (iOS distribution)."
