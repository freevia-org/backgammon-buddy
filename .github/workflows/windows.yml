name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: build portable Windows app
    # The registered I5 runner has Visual Studio Build Tools, MSVC x86/x64, and
    # ATL installed for the native release build.
    runs-on: backgammon-buddy-i5-windows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine_shim

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC ATL headers for Windows plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw 'MSVC did not expose VCToolsInstallDir; the Windows C++ build environment is unavailable.'
          }
          $atlHeader = Join-Path $env:VCToolsInstallDir 'atlmfc/include/atlstr.h'
          if (-not (Test-Path -LiteralPath $atlHeader)) {
            throw "Missing $atlHeader. Install Visual Studio Build Tools component Microsoft.VisualStudio.Component.VC.ATL (C++ ATL for latest v143 build tools, x86 and x64)."
          }

      - name: Install MinGW CMake, Ninja and GCC
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc

      - name: Build Windows checker engine
        shell: pwsh
        run: ./native/engine_shim/build-windows.ps1

      - name: Build Windows GNUbg engine
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          cmake --version
          ninja --version
          gcc --version
          g++ --version
          ./native/gnubg/build-windows.ps1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Set up NuGet CLI for flutter_tts
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '7.9.0'

      - run: flutter pub get
        working-directory: app

      - name: Build release app
        run: flutter build windows --release --no-pub
        working-directory: app

      - name: Package portable Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'app/build/windows/x64/runner/Release'
          foreach ($required in @('aigammon_app.exe', 'aigammon_engine.dll', 'libbuddy_gnubg.dll', 'data/flutter_assets')) {
            if (-not (Test-Path (Join-Path $releaseDir $required))) {
              throw "Windows release is missing required file: $required"
            }
          }
          $version = (Select-String -Path 'app/pubspec.yaml' -Pattern '^version:\s+([^+]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          @"
          Backgammon Buddy $version for Windows x64

          Extract the full folder, then run aigammon_app.exe. Keep the DLLs and data folder beside the executable.
          This is a portable build; it does not install shortcuts or add an uninstaller.
          "@ | Set-Content -Path (Join-Path $releaseDir 'README.txt') -Encoding utf8
          $archive = "BackgammonBuddy-$version-Windows-x64.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $archive -CompressionLevel Optimal
          Get-Item $archive | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: backgammon-buddy-windows
          path: BackgammonBuddy-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
