name: Android
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Explicit version code above every previous release (or set RELEASE_BUILD_NUMBER_BASE)
        type: string
        default: ''
      build_appbundle:
        description: Build a signed Google Play bundle artifact (does not upload to Play)
        type: boolean
        default: false
  # On-demand release lane. Dispatch ci.yml first for this commit; this lane
  # waits for its successful result before distributing to testers.

permissions:
  contents: read
  # `gh run list` in the Wait-for-CI gate reads CI's run for this commit.
  actions: read

concurrency:
  # PRs: one live run per PR, superseded pushes are cancelled. master/dispatch:
  # keyed on the COMMIT so a newer master commit never cancels an older one's
  # in-flight distribution; only a re-run of the same commit is superseded.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  apk:
    name: build APK + distribute
    runs-on: ubuntu-24.04
    # Cold path: NDK download, Rust Android targets and Gradle dependencies
    # fetched from scratch, then a release APK, plus up to ~40 min waiting for CI
    # before distribution (normally zero: CI finishes first).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ vars.RELEASE_BUILD_NUMBER_BASE }}
        run: python3 tool/release_build_number.py

      # Two ABIs, not three. `x86_64-linux-android` is an EMULATOR target: no
      # phone or tablet in the testers group runs it, and every build paid for a
      # third full Rust cross-compile plus a third copy of the engine .so inside
      # a universal APK. Re-add it (here and in the cargo-ndk step below) if the
      # app ever has to run on an x86_64 emulator or a Chromebook.
      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine_shim

      # cargo-ndk drives the NDK toolchain for cross-compiling the cdylib.
      # Cached across runs via ~/.cargo/bin (restored by rust-cache above is
      # crate-scoped, so we guard the install with a `which` check).
      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # NDK 28.2.13676358 is pinned LITERALLY in app/android/app/build.gradle.kts
      # (`ndkVersion = "28.2.13676358"`, no longer `flutter.ndkVersion`), and this
      # step is the other half of that pin: the two must be edited together, or
      # cargo-ndk cross-compiles the engine against one NDK while Gradle packages
      # it for another. The local runner’s Android SDK may have other NDKs under
      # $ANDROID_SDK_ROOT/ndk, but not necessarily this exact revision, and both
      # cargo-ndk (engine .so) and Flutter's gradle build must agree on the NDK.
      # Simplest reliable path: install the exact version via sdkmanager and
      # point ANDROID_NDK_HOME at it for the cargo-ndk step.
      - name: Install Android NDK 28.2.13676358
        # No `pipefail`: `yes |` receives SIGPIPE once sdkmanager stops reading
        # (licenses already accepted on the runner), which would otherwise fail
        # the pipeline even though sdkmanager itself succeeded.
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cross-compile engine shim -> jniLibs
        working-directory: native/engine_shim
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a \
            -o ../../app/android/app/src/main/jniLibs \
            build --release

      - name: List staged jniLibs
        run: find app/android/app/src/main/jniLibs -type f -name '*.so' -exec ls -l {} +

      # cache: true restores the Flutter SDK + pub cache (same key as ci.yml's
      # Linux jobs) instead of downloading the SDK on every run (~1 min).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # Gradle wrapper distribution + dependency/transform caches. Without this
      # every run downloaded Gradle 9.1, AGP, Kotlin and the Firebase/AndroidX
      # graph from scratch during the APK build. Keyed on every Gradle
      # input and on pubspec.lock (Flutter plugins contribute Gradle modules);
      # a prefix restore keeps a dependency bump incremental. PR runs read the
      # master entry; only master writes one GitHub-side.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/gradle.properties', 'app/pubspec.lock', 'tool/mobile_dependencies.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      # Release signing, gated on four repository secrets exactly the way the
      # Firebase and iOS-signing paths are gated. Present -> decode the upload
      # keystore and write the key.properties that app/android/app/build.gradle.kts
      # reads. Absent -> say so loudly and let Gradle's documented debug-key
      # fallback keep the job green. See app/android/KEYSTORE_SETUP.md.
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/master' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/master' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -eu
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/freevia-backgammon-buddy-upload.jks
            # A .properties file treats backslash as an escape, so escape it.
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
            {
              echo "storeFile=freevia-backgammon-buddy-upload.jks"
              echo "storePassword=$(esc "$ANDROID_KEYSTORE_PASSWORD")"
              echo "keyAlias=$(esc "$ANDROID_KEY_ALIAS")"
              echo "keyPassword=$(esc "$ANDROID_KEY_PASSWORD")"
            } > app/android/key.properties
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Release signing ENABLED (upload keystore installed)"
          elif [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            # Release secrets are never exposed to PR builds; the debug-key
            # fallback is the expected, quiet path here.
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Pull request build: release signing disabled by design (debug keystore)"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets not set — the release APK will be signed with the DEBUG keystore and cannot be published. See app/android/KEYSTORE_SETUP.md"
          fi

      - name: Require release signing for a Play bundle
        if: inputs.build_appbundle && steps.signing.outputs.has_signing != 'true'
        run: |
          echo "::error::A Play bundle requires all four Android signing secrets. See app/android/KEYSTORE_SETUP.md."
          exit 1

      - name: Require owner-selected release build number
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          if [ "$HAS_RELEASE_BUILD_NUMBER" != 'true' ]; then
            echo '::error::Set RELEASE_BUILD_NUMBER_BASE or a build_number above prior published versions before signing.'
            exit 1
          fi

      # Android telemetry config file, generated — never committed.
      #
      # `google-services.json` is what the com.google.gms.google-services Gradle
      # plugin reads, and that plugin is the prerequisite for the Crashlytics
      # and Performance Gradle plugins (Crashlytics v3 resolves the app id from
      # the `google_app_id` string resource google-services generates; there is
      # no way to feed it a --dart-define). Those plugins are what buy NDK crash
      # capture for the Rust engine `.so` and automatic network/screen traces.
      #
      # Its contents are NOT secret — project id, project number, app id and the
      # Web API key all ship inside every APK already, and three of the four are
      # repo *Variables* rather than secrets for exactly that reason. It is
      # generated rather than committed for the same reason `key.properties` is:
      # a fork that inherited a real file would silently report ITS crashes into
      # THIS project. See app/android/app/build.gradle.kts and firebase/DEPLOY.md.
      #
      # Gated all-or-nothing on the same four values as the telemetry defines
      # below. Absent -> no file -> app/build.gradle.kts skips all three Firebase
      # Gradle plugins and the build stays green with Dart-only reporting.
      - name: Configure Firebase Android config
        env:
          FB_PROJECT: ${{ vars.AIGAMMON_FIREBASE_PROJECT }}
          FB_API_KEY: ${{ vars.AIGAMMON_FIREBASE_API_KEY }}
          FB_SENDER_ID: ${{ vars.AIGAMMON_FIREBASE_SENDER_ID }}
          FB_ANDROID_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_ANDROID_APP_ID || '' }}
        run: |
          set -eu
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ] \
             && [ -n "$FB_SENDER_ID" ] && [ -n "$FB_ANDROID_APP_ID" ]; then
            # jq rather than a heredoc: every one of these values is
            # externally supplied, and jq is the only thing here that cannot be
            # talked into emitting invalid JSON. --arg also keeps the numeric
            # project_number a STRING, which is what the schema wants.
            #
            # package_name MUST equal `applicationId` in
            # app/android/app/build.gradle.kts — the plugin fails the build with
            # "No matching client found for package name" when it does not.
            jq -n \
              --arg project_number "$FB_SENDER_ID" \
              --arg project_id "$FB_PROJECT" \
              --arg app_id "$FB_ANDROID_APP_ID" \
              --arg package_name "org.freevia.backgammonbuddy" \
              --arg api_key "$FB_API_KEY" \
              '{
                 project_info: {
                   project_number: $project_number,
                   project_id: $project_id
                 },
                 client: [{
                   client_info: {
                     mobilesdk_app_id: $app_id,
                     android_client_info: { package_name: $package_name }
                   },
                   oauth_client: [],
                   api_key: [{ current_key: $api_key }],
                   services: {
                     appinvite_service: { other_platform_oauth_client: [] }
                   }
                 }],
                 configuration_version: "1"
               }' > app/android/app/google-services.json
            echo "Firebase Android config WRITTEN — Crashlytics/Performance Gradle plugins will apply"
          else
            echo "::warning::Firebase telemetry config incomplete — no google-services.json; the Crashlytics/Performance Gradle plugins will NOT apply and Android native (NDK) crashes will go unreported. See firebase/DEPLOY.md."
          fi

      # Every CI build gets a unique, monotonically increasing build number
      # (the workflow run number), so testers can tell releases apart in
      # Firebase App Distribution. The semantic version comes from pubspec.
      # Online-play dart-defines are injected when the repo VARIABLES
      # AIGAMMON_FIREBASE_PROJECT and AIGAMMON_FIREBASE_API_KEY are set
      # (Settings -> Secrets and variables -> Actions -> Variables); when
      # unset the app builds with online play "not configured", exactly as
      # before. See firebase/DEPLOY.md.
      #
      # --obfuscate --split-debug-info strips Dart symbols out of the binary
      # and into build/symbols/android. Two consequences worth knowing:
      #   * a stack trace from a release build is now UNREADABLE until it is
      #     symbolicated (`flutter symbolize -d <symbols> -i trace.txt`), which
      #     is why the symbols directory is uploaded as its own artifact,
      #     keyed by run number so a trace can be matched to the exact build;
      #   * `runtimeType.toString()` no longer yields real class names. The
      #     only uses in this repo are diagnostic message interpolation
      #     (net_match_controller, match_transport, online_client) — degraded
      #     text, no behaviour change. Nothing here dispatches on it.
      #
      # Use one ARM/ARM64 APK with the SAME version code as the optional AAB.
      # Flutter split APKs add ABI offsets (+1000/+2000); a later AAB would then
      # be a version downgrade for sideload testers. Play's AAB delivery handles
      # device-specific size optimization without separate uploaded APK codes.
      # --target-platform still limits Flutter to the two compiled Rust ABIs.
      - name: Build release APK
        working-directory: app
        env:
          FB_PROJECT: ${{ vars.AIGAMMON_FIREBASE_PROJECT }}
          FB_API_KEY: ${{ vars.AIGAMMON_FIREBASE_API_KEY }}
          FB_SENDER_ID: ${{ vars.AIGAMMON_FIREBASE_SENDER_ID }}
          # Reused from the App Distribution setup below — the SAME Android app
          # id identifies the app to distribute and to report telemetry for, so
          # there is deliberately no second secret for it.
          FB_ANDROID_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_ANDROID_APP_ID || '' }}
          BUILD_APPBUNDLE: ${{ inputs.build_appbundle }}
        run: |
          DEFINES=""
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ]; then
            DEFINES="--dart-define=AIGAMMON_FIREBASE_PROJECT=$FB_PROJECT --dart-define=AIGAMMON_FIREBASE_API_KEY=$FB_API_KEY"
            echo "Online play ENABLED for project $FB_PROJECT"
          else
            echo "Online-play repo variables not set — building with online play not configured"
          fi
          # Analytics / Performance / Crashlytics. Independent of the online
          # gate above: telemetry needs the project + key AND the numeric sender
          # id AND the Android app id, and the app builds fine (silently, with
          # no telemetry) when any of them is missing. See firebase/DEPLOY.md.
          if [ -n "$FB_PROJECT" ] && [ -n "$FB_API_KEY" ] \
             && [ -n "$FB_SENDER_ID" ] && [ -n "$FB_ANDROID_APP_ID" ]; then
            DEFINES="$DEFINES --dart-define=AIGAMMON_FIREBASE_SENDER_ID=$FB_SENDER_ID --dart-define=AIGAMMON_FIREBASE_ANDROID_APP_ID=$FB_ANDROID_APP_ID"
            echo "Telemetry configured (collection requires user opt-in)"
          else
            echo "Telemetry config incomplete — building with analytics/performance/crashlytics disabled"
          fi
          # DEFINES is a flag list and must word-split.
          # shellcheck disable=SC2086
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols/android \
            $DEFINES
          ls -l build/app/outputs/flutter-apk/*.apk
          # Flutter otherwise also builds x86_64, whose Rust engine was not
          # compiled above. Check the actual APKs, not just the staged inputs.
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -Z1 build/app/outputs/flutter-apk/app-release.apk \
              | grep -Fx "lib/$ABI/libaigammon_engine.so"
          done
          python3 ../tool/release_preflight.py \
            --android build/app/outputs/flutter-apk/app-release.apk \
            --zipalign "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/zipalign"
          if [ "$BUILD_APPBUNDLE" = 'true' ]; then
            # DEFINES is a flag list and must word-split.
            # shellcheck disable=SC2086
            flutter build appbundle --release \
              --target-platform android-arm,android-arm64 \
              --build-number="$BUILD_NUMBER" \
              --obfuscate --split-debug-info=build/symbols/android-bundle \
              $DEFINES
            for ABI in arm64-v8a armeabi-v7a; do
              unzip -Z1 build/app/outputs/bundle/release/app-release.aab \
                | grep -Fx "base/lib/$ABI/libaigammon_engine.so"
            done
            python3 ../tool/release_preflight.py --android build/app/outputs/bundle/release/app-release.aab
          fi

      - name: Capture Android native dependency evidence
        run: |
          (cd app/android && ./gradlew -I ../../tool/mobile_dependencies.gradle :app:writeMobileDependencyInventory)
          ARGS=()
          for ARTIFACT in app/build/app/outputs/flutter-apk/*release.apk app/build/app/outputs/bundle/release/*.aab; do
            if [ -f "$ARTIFACT" ]; then ARGS+=(--artifact "$ARTIFACT"); fi
          done
          python3 tool/mobile_dependency_inventory.py "${ARGS[@]}" \
            --android-dependencies app/build/mobile-dependencies/android/resolved.json \
            --out-dir app/build/mobile-dependencies/android
          python3 tool/mobile_notices.py --check \
            --android-resolved app/build/mobile-dependencies/android/resolved.json \
            --flutter-license "$(dirname "$(dirname "$(command -v flutter)")")/bin/cache/pkg/sky_engine/LICENSE"

      # Stop the daemon Flutter's build left running so the Gradle cache is
      # saved from a quiescent ~/.gradle (no half-written journal/lock files).
      - name: Stop Gradle daemon
        if: always()
        run: (cd app/android && ./gradlew --stop) || true

      - name: Upload Android dependency evidence
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-android-dependencies-${{ github.run_number }}
          path: app/build/mobile-dependencies/android
          if-no-files-found: error

      - name: Upload signed Google Play bundle
        if: inputs.build_appbundle
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-play-bundle-${{ github.run_number }}
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols/android-bundle
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aigammon-apk
          # Universal ARM/ARM64 APK; version code matches the optional AAB.
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Keyed by run number: the build number in the APK is the same value, so
      # a trace from a tester's build maps to exactly one symbols artifact.
      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-symbols-android-${{ github.run_number }}
          path: app/build/symbols/android
          if-no-files-found: error

      - name: Upload unstripped native engine symbols
        uses: actions/upload-artifact@v7
        with:
          name: aigammon-native-symbols-android-${{ github.run_number }}
          path: |
            app/android/app/src/main/jniLibs
            app/build/app/intermediates/cxx/**/obj/**/libbuddy_gnubg.so
          if-no-files-found: error

      # Secrets can't be referenced in a step-level `if:`, so gate on an env var
      # exported from a prior shell step.
      - name: Check Firebase secrets
        id: fb
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          FIREBASE_ANDROID_APP_ID: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_ANDROID_APP_ID || '' }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
          fi

      # The gate that used to be the `workflow_run` trigger: block the tester
      # upload until CI has passed for THIS commit. Builds start in parallel
      # with CI, and CI (~4-5 min) normally finishes long before the APK
      # (~8-10 min), so this usually returns immediately. A red or cancelled CI
      # fails the job here and nothing is distributed; after re-running CI to
      # green, re-run this job. Manual dispatch stays the ungated escape hatch.
      - name: Wait for CI to pass on this commit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && steps.fb.outputs.has_firebase == 'true' && steps.signing.outputs.has_signing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/wait-for-ci.sh

      - name: Distribute to Firebase App Distribution
        if: steps.fb.outputs.has_firebase == 'true' && steps.signing.outputs.has_signing == 'true'
        # Pinned to a commit SHA, not the `v1` tag: a mutable tag can be
        # repointed at any commit by the action's owner (or by anyone who
        # compromises that account), and this step is handed the Firebase
        # service-account key. `v1` resolved to this commit on 2026-07-31.
        # Re-pin deliberately when upgrading; do not switch back to a tag.
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_ANDROID_APP_ID || '' }}
          serviceCredentialsFileContent: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          groups: testers
          file: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Skip Firebase distribution (Firebase or signing secrets not set)
        if: steps.fb.outputs.has_firebase != 'true' || steps.signing.outputs.has_signing != 'true'
        run: |
          echo "Firebase or Android signing secrets not set — skipping distribution (see .github/workflows/README.md: Firebase App Distribution setup)"
