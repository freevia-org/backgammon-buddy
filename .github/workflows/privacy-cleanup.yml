name: Privacy cleanup

on:
  # Offset from the hour to reduce contention on shared GitHub runners.
  schedule:
    - cron: '17 * * * *'
  # Manual execution is always read-only; scheduled runs apply retention.
  workflow_dispatch:

permissions: {}

concurrency:
  group: backgammon-buddy-privacy-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository_id == '1410906868' &&
      github.repository_owner_id == '333371985' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Prepare/test before minting a short-lived token. No npm or Admin SDK.
      - name: Check cleanup runner
        run: |
          node --check firebase/admin/privacy_cleanup.mjs
          node --test firebase/admin/privacy_cleanup.test.mjs
      - name: Authenticate cleanup identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: backgammon-buddy-freevia
          workload_identity_provider: projects/583751824961/locations/global/workloadIdentityPools/github-privacy/providers/github-cleanup
          service_account: privacy-cleanup@backgammon-buddy-freevia.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Process online retention and erasure requests
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CLEANUP_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--project backgammon-buddy-freevia)
          if [ "$CLEANUP_EVENT" = 'schedule' ]; then
            args+=(--apply --confirm-project backgammon-buddy-freevia)
          fi
          node firebase/admin/privacy_cleanup.mjs "${args[@]}" | tee "$RUNNER_TEMP/privacy-cleanup-counts.json"
      - name: Summarize cleanup counts
        if: always()
        run: |
          {
            printf '## Privacy cleanup\n\n'
            if [ -s "$RUNNER_TEMP/privacy-cleanup-counts.json" ]; then
              printf '```json\n'
              cat "$RUNNER_TEMP/privacy-cleanup-counts.json"
              printf '\n```\n\nA nonzero run result requires investigation; counts do not imply completion.\n'
            else
              printf 'No completed cleanup summary is available. Inspect the failed step before retrying.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
