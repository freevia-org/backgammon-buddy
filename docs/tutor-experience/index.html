#e9eeeb;margin:11px 0}.options-shade{position:absolute;inset:0;background:#14283357;z-index:7;display:flex;align-items:flex-end}.options-sheet{width:100%;height:72%;border-radius:22px 22px 0 0;background:#fff;padding:8px 17px 18px;box-shadow:0 -12px 32px #1428332e}.sheet-handle{width:34px;height:4px;border-radius:8px;background:#c6cfca;margin:1px auto 12px}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet-top h3{font-size:16px;margin:0;letter-spacing:-.02em}.close{border:0;border-radius:20px;width:27px;height:27px;background:#f1f4f2;color:#54665f}.sheet-desc{font-size:10px;color:#6c7c80;margin:4px 0 11px}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset{border:1px solid #dce5e0;border-radius:12px;background:#fff;padding:9px 9px 8px;min-height:80px;cursor:pointer}.preset.active{border:2px solid #32765c;background:#eff7f1;box-shadow:0 0 0 2px #32765c15}.preset-title{font-size:11px;font-weight:800;color:#25483d}.preset-icon{float:right;color:#779385;font-size:13px}.preset p{font-size:9px;line-height:1.35;color:#65767a;margin:5px 0 0}.custom-head{display:flex;justify-content:space-between;align-items:center;margin:13px 0 3px;font-size:11px;font-weight:800}.small-pill{border-radius:14px;background:#f1f4f2;padding:4px 7px;color:#687a77;font-size:8px}.toggle{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0ed;padding:8px 0}.toggle strong{display:block;font-size:10px}.toggle small{display:block;color:#79888b;font-size:8px;margin-top:2px}.switch{width:27px;height:16px;border-radius:10px;background:#c4ceca;position:relative;flex:none}.switch:after{content:"";position:absolute;top:2px;left:2px;background:white;width:12px;height:12px;border-radius:50%;box-shadow:0 1px 2px #0002}.switch.on{background:#34775e}.switch.on:after{left:13px}.screen-info{max-width:390px}.screen-info .count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#4e7b69;font-weight:800}.screen-info h2{font-size:clamp(22px,3vw,32px);letter-spacing:-.035em;line-height:1.12;margin:10px 0 12px}.screen-info p{font-size:14px;line-height:1.65;color:#5e7078;margin:0 0 16px}.screen-info .why{border-left:3px solid #78a88f;padding:3px 0 3px 14px;color:#385e4e;font-size:13px;line-height:1.6}.keys{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.keys span{border:1px solid #dae4de;border-radius:20px;padding:6px 9px;color:#577267;font-size:10px;background:#ffffffb8}.credit{font-size:10px;color:#8a9698;margin-top:18px}.screen{display:none}.screen.active{display:flex;flex-direction:column}.board .top:nth-child(odd) .tri{border-top-color:#e7c79a}.board .bottom:nth-child(odd) .tri{border-bottom-color:#e7c79a}
.screen-capture{margin:0 auto;width:min(100%,360px);aspect-ratio:1080/2412;max-height:calc(100vh - 200px);background:#101820;border:8px solid #122632;border-radius:42px;overflow:hidden;box-shadow:var(--shadow)}.screen-capture img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}@media(max-width:760px){.shell{padding:20px 12px 32px}.top{align-items:flex-start;flex-direction:column;gap:9px}.badge{display:none}.stage{grid-template-columns:1fr;gap:22px}.device{width:min(100%,390px);height:min(844px,calc(100vh - 220px));min-height:600px;border-width:6px;border-radius:34px}.screen-info{max-width:540px;order:-1;padding:0 4px}.screen-info p{font-size:13px}.tabs button{padding:10px 12px}.board-wrap{height:35%}.expanded{height:54%;min-height:330px}}

<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">Freevia · Backgammon Buddy</div><h1>Improve your play with a tutor</h1><p>Five connected game moments, designed around clear coaching and a calm live board.</p></div><div class="badge">Interactive gallery · select a concept</div></div>
  <nav class="tabs" aria-label="Prototype screens">
    <button class="active" data-screen="position">1 · Position</button><button data-screen="explanation">2 · Explain a play</button><button data-screen="options">3 · Tutoring style</button><button data-screen="history">4 · Review a move</button><button data-screen="computer">5 · Computer turn</button>
  </nav>
  <section class="stage">
    <figure class="screen-capture">
      <img id="screenShot" src="screenshots/phone-10023-next-roll.png" alt="Real Android screenshot of Backgammon Buddy showing the current board, move log, and concise tutor reasoning." />
    </figure>    <aside class="screen-info" id="info"></aside>
  </section>
</main>
<script>
const screenShots={
position:{src:'screenshots/phone-10023-next-roll.png',alt:'Real Android screenshot showing the current board, move log, and concise tutor reasoning.'},
explanation:{src:'screenshots/phone-10023-hint-why.png',alt:'Real Android screenshot showing ranked plays and an expanded move explanation.'},
options:{src:'screenshots/phone-10023-live-options.png',alt:'Real Android screenshot of Backgammon Buddy tutoring preferences.'},
history:{src:'screenshots/phone-10023-ai-history-review.png',alt:'Real Android screenshot showing a selected game-log move and its tutor review.'},
computer:{src:'screenshots/phone-10023-collapsed-computer.png',alt:'Real Android screenshot showing a completed computer move, tutor comment, and Roll action.'}
};const descriptions={
position:{count:'Screen 1 of 5 · live position',title:'A plan for the position, not just a label',body:'The full board and move log stay visible with a concise position assessment and one useful strategic cue. The expanded tutor can add more explanation without changing the board layout.',why:'Use after every roll. The player should leave knowing what to look for while choosing a move.',chips:['Current position','Tutor assessment','Move controls']},
explanation:{count:'Screen 2 of 5 · completed player move',title:'Explain the tradeoff and show a plausible reply',body:'The expanded panel turns “missed opportunity” into a lesson: what the alternative preserves, what the chosen play risks, and one concrete scenario. Notation and engine estimates stay secondary.',why:'A grade only says how the play scored. A brief cause-and-effect explanation tells the player what to recognize next time.',chips:['Staged move','Everyday language','Opponent scenario']},
options:{count:'Screen 3 of 5 · tutoring preferences',title:'Choose a tutoring style in one tap',body:'Four presets describe the experience in plain language. Custom exposes the independent controls for players who want precise behavior. The same settings remain reachable from the expanded tutor cog.',why:'Five separate switches make beginners design their own tutor. Presets help players quickly choose how much help they want.',chips:['Coach','Hint when asked','Try first','Custom']},
history:{count:'Screen 4 of 5 · historical move selected',title:'Keep the selected move clear during review',body:'The selected log entry remains visibly outlined while the tutor shows its analysis. The board and live controls stay as they are; choosing a current move returns the tutor to live feedback.',why:'The selected-row highlight makes the move under discussion clear while the user continues in the current game.',chips:['Selected log row','Tutor analysis','Live play continues']},
computer:{count:'Screen 5 of 5 · computer finished its move',title:'Narrate the handoff, then invite the next roll',body:'The tutor names the strategic point behind the computer’s move and gives a small cue for the player’s turn. Roll remains the dominant action in the same place.',why:'A quality label like “sound play” is not a reason. A short move comment makes the computer opponent feel instructive and sets up the next decision.',chips:['Computer move','Strategic reason','Roll next']}
};
function render(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));
  const shot=screenShots[name];
  const image=document.getElementById('screenShot');
  image.src=shot.src;
  image.alt=shot.alt;
  const info=descriptions[name];
  document.getElementById('info').innerHTML='<div class="count">'+info.count+'</div><h2>'+info.title+'</h2><p>'+info.body+'</p><div class="why">'+info.why+'</div><div class="keys">'+info.chips.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="credit">Real Android screenshot · captured during app testing.</div>';
}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen)));render('position');</script>
</body></html>
